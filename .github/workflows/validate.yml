name: Validate static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Validate approved experience and local resources
        run: python3 tools/site.py check --require-node
      - name: Run validator negative controls
        run: python3 -m unittest discover -s tests -v
      - name: Verify deterministic static package
        run: python3 tools/site.py package --out "$RUNNER_TEMP/magdalena" --require-node
